<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Empier — Desktop landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { margin: 0; padding: 0; background: #0a0712; min-height: 100%; font-family: 'Inter', system-ui, sans-serif; color: #f4f2f8; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
  a { cursor: pointer; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="image-slot.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="desktop-landing.jsx"></script>
  <script type="text/babel" data-presets="env,react">
    const DESKTOP_TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "violet",
      "theme": "dark"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(DESKTOP_TWEAK_DEFAULTS);
      return (
        <>
          <EmpierDesktopLanding tweaks={t} />
          <TweaksPanel>
            <TweakSection label="Brand" />
            <TweakColor
              label="Accent"
              value={ACCENTS[t.accent].base}
              options={[ACCENTS.violet.base, ACCENTS.cyan.base, ACCENTS.amber.base]}
              onChange={(v) => {
                const key = Object.keys(ACCENTS).find(k => ACCENTS[k].base === v) || 'violet';
                setTweak('accent', key);
              }}
            />
            <TweakSection label="Theme" />
            <TweakRadio
              label="Mode"
              value={t.theme}
              options={['dark', 'light']}
              onChange={(v) => setTweak('theme', v)}
            />
          </TweaksPanel>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
